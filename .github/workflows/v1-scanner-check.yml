name: V1 scanner checks

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/scan-binance-perpetuals/**"
      - "supabase/migrations/**"
      - ".github/workflows/v1-scanner-check.yml"

jobs:
  deno-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check V1 Edge Function
        run: deno check supabase/functions/scan-binance-perpetuals/index.ts
      - name: Test deterministic risk model
        run: deno test supabase/functions/scan-binance-perpetuals/risk-model.test.ts
